# playkeeper.io on port 80. The Coolify proxy in front of it terminates TLS.

# The install log: a line for each request for /install or /install/<code>,
# with the visitor's address, in a file a day that install-logs.sh deletes
# after 30 days. The Coolify proxy connects from a private address and puts
# the visitor's last in X-Forwarded-For; any other peer is the visitor. Only
# this log has it: other requests are logged with the peer's address.
map "$remote_addr $http_x_forwarded_for" $installer {
    "~^(?:(?:10|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9.]+|f[cd][0-9a-f]*:[0-9a-f:]*) .*?(?<forwarded>[^, ]+)$" $forwarded;
    default $remote_addr;
}
log_format installs '$time_iso8601 $installer $request_method $uri $status "$http_user_agent"';
map $time_iso8601 $installs_day {
    "~^(?<day>\d{4}-\d{2}-\d{2})" $day;
    default undated;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/atom+xml text/plain;

    # The Content-Security-Policy, /community and the channels' links under
    # /go/ follow the site's settings (internal/site/settings.go); cmd/site
    # writes them into this file.
    include /etc/nginx/playkeeper-site.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Not no-referrer: with it, Firefox and Safari send the analytics'
    # beacons with "Origin: null", which its collector refuses. Other sites
    # still get only the origin, never a page's address.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # How long caches may keep an answer, for a location that says more than
    # expires can (the release files below); empty adds nothing.
    set $cache_control "";
    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;

    # A few lines that run the latest release's get.sh (site/install.sh)
    # rather than a copy of it, so each new release is served without
    # redeploying the site; they tell get.sh the install came through
    # playkeeper.io, for the anonymous install count. /install/<code> is the
    # same script with the code filled in, saying whose command it was
    # (Settings.Channels); any code works, so a typo on screen still installs.
    # These requests go to the install log alone.
    location ~* "^/install(?:/(?<channel>[a-z0-9-]{1,32}))?$" {
        access_log /var/log/playkeeper/installs-$installs_day.log installs;
        expires -1;
        types { }
        default_type text/plain;
        sub_filter_types text/plain;
        sub_filter 'PLAYKEEPER_INSTALL_CHANNEL=""' 'PLAYKEEPER_INSTALL_CHANNEL="$channel"';
        # alias, not try_files, which would log every request as /install.sh.
        alias /usr/share/nginx/playkeeper/install.sh;
    }

    # The live demo: the dashboard with sample data, all in the browser. Any
    # path under /demo/ that isn't a file is one of its pages, so the app
    # answers it; the page itself is checked again on every visit, and its
    # hashed files are kept for a year.
    location = /demo {
        return 301 /demo/;
    }
    location /demo/ {
        expires -1;
        try_files $uri /demo/index.html;
    }
    location /demo/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The latest release's signed manifest and its signature, which installed
    # Playkeepers (0.4.9 and later) check for a new release about every half
    # hour: cmd/release-mirror copies them from GitHub every minute, once
    # they verify (site/release-mirror.sh). A check that finds them unchanged
    # is answered 304 Not Modified, a few hundred bytes: their ETag and
    # Last-Modified come from the release's date, so they stay the same
    # across deploys. Caches may keep them five minutes, and serve them for a
    # day while this site is down; they're signed, so an old copy can only
    # be late, never wrong. Not zipped, so the ETag stays strong, and not
    # logged, since every install asks all day.
    location ~ "^/releases/latest/playkeeper-release\.json(\.sig)?$" {
        access_log off;
        gzip off;
        set $cache_control "public, max-age=300, stale-while-revalidate=300, stale-if-error=86400";
        types { application/json json; text/plain sig; }
        try_files $uri =404;
    }

    # Pages are .html files answered without the extension: /pricing is
    # pricing.html, and the share page /t is t.html (its template is in the
    # address after #, which browsers never send, so it never reaches this
    # server). Pages are checked again on every visit; the files they use
    # carry a hash in their names, so they are kept for a year. expires
    # rather than add_header, which would drop the headers above.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location / {
        expires -1;
        try_files $uri $uri.html =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # An address ending in / is the page without it: /docs/ is /docs.
    location ~ ^/(?!demo/)(.+)/$ {
        return 301 /$1;
    }
    location = /index {
        return 301 /;
    }
    location = /404 {
        return 404;
    }
    location = /404.html {
        internal;
    }
}

# www.playkeeper.io reaches this container too, but the site's address is
# playkeeper.io, the one every canonical link, the sitemap and each social
# preview name; one address keeps search engines from seeing each page twice.
server {
    listen 80;
    server_name www.playkeeper.io;
    server_tokens off;
    return 301 https://playkeeper.io$request_uri;
}
