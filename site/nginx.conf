# playkeeper.io on port 80. The Coolify proxy in front of it terminates TLS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # A redirect rather than a copy of get.sh, so each new release is served
    # without redeploying the site.
    location = /install {
        return 302 https://github.com/CIYAhq/playkeeper/releases/latest/download/get.sh;
    }

    location = /sizing {
        try_files /sizing.html =404;
    }
    location = /sizing/ {
        return 301 /sizing;
    }

    # The live demo: the dashboard with sample data, all in the browser. Any
    # path under /demo/ that isn't a file is one of its pages, so the app
    # answers it; the page itself is checked again on every visit, and its
    # hashed files are kept for a year. expires rather than add_header, which
    # would drop the headers above.
    location = /demo {
        return 301 /demo/;
    }
    location /demo/ {
        expires -1;
        try_files $uri /demo/index.html;
    }
    location /demo/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
