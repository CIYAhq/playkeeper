name: Release check

# The full click-through before a release: every control on every page, at
# desktop and phone sizes, split between runners, and the gate that proves
# together they pressed every page's controls (clickthrough.yml). Pull
# requests crawl only the pages they touch. Run this on the commit you are
# about to tag (CONTRIBUTING.md, Releases): the Release workflow publishes a
# tag only after a green Release check on its commit, and otherwise runs the
# same click-through first.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  plan:
    name: Every page, split between runners
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: The runners for every page at each size
        id: plan
        run: .tools/node/bin/node test/e2e/ui/plan.ts --full

  package:
    name: Package — the release tarball the click-through installs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make package
        run: make package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/playkeeper-linux-amd64.tar.gz*
            dist/get.sh
          retention-days: 7

  clickthrough:
    name: Click-through
    needs: [plan, package]
    uses: ./.github/workflows/clickthrough.yml
    with:
      artifact: release
      matrix: ${{ needs.plan.outputs.matrix }}
