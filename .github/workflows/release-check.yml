name: Release check

# Builds the release exactly as it will be published (release-build.yml: the
# version from CHANGELOG.md's newest section, or the one given, with
# CurseForge's key built in), installs it on a fresh runner, and clicks
# through every control on every page of those assets at desktop and phone
# sizes, split between runners, with the gate that proves together they
# pressed every page's controls (clickthrough.yml), and runs the ARM64
# workflow on those assets on GitHub's ARM runners (arm64.yml). It runs every
# end-to-end check on those assets too (e2e.yml): the install, onboarding,
# bots, backup and uninstall, the restore on a second runner, every page's
# accessibility and width, the core flows, the upgrade from the current
# release with its rollback, the site and names service images, Pebble's
# certificates and the faked-panel browser checks. It also installs, plays
# on, backs up, restores, updates and uninstalls this commit on every
# supported release of Ubuntu, Debian, the RHEL family and Amazon Linux
# (os-matrix.yml). This is the full suite, and it runs once per release: pull
# requests run the fast checks, a crawl of the pages they change and the
# end-to-end parts whose own files they change (ci.yml), and the OS matrix
# and ARM64 only when they change installer or OS code. Run this on the
# commit you are about to tag (CONTRIBUTING.md, Releases): the tag publishes
# these assets, byte for byte, once this and CI have passed on its commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version you will tag, without the v (empty for CHANGELOG.md's newest section)
        type: string
        default: ""
  # For tokens that can push but can't start workflows by hand, like the
  # agents': pushing the commit you will tag, unchanged, to a branch named
  # like this runs the same check on exactly that commit, with the version
  # from CHANGELOG.md's newest section.
  push:
    branches: ["siya/release-check-*"]

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  plan:
    name: Every page, split between runners
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: The runners for every page at each size
        id: plan
        run: .tools/node/bin/node test/e2e/ui/plan.ts --full

  build:
    name: Release
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ inputs.version }}
      release: true
      retention-days: 30
    secrets:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  clickthrough:
    name: Click-through
    needs: [plan, build]
    uses: ./.github/workflows/clickthrough.yml
    with:
      artifact: release-${{ needs.build.outputs.tag }}
      assets: assets
      matrix: ${{ needs.plan.outputs.matrix }}

  e2e:
    name: End to end
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      artifact: release-${{ needs.build.outputs.tag }}
      assets: assets

  os-matrix:
    name: OS matrix
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/os-matrix.yml

  arm64:
    name: ARM64
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/arm64.yml
    with:
      artifact: release-${{ needs.build.outputs.tag }}
