name: Release

# A v* tag publishes the release its commit's Release check built and checked
# (release-check.yml, release-build.yml): the same assets, byte for byte, that
# were installed on fresh runners and clicked through on every page, so what
# is published is what was checked. It needs a green CI run and a green
# Release check of the tag's version on the tagged commit, and otherwise fails
# at once, saying which is missing. It signs the manifest with the
# PLAYKEEPER_RELEASE_SIGNING_KEY secret (the key must match
# internal/update/release.pub, which installed versions check updates
# against), checks the assets again, publishes them as the latest (normal,
# not pre-release) GitHub release, then checks the live addresses: the GitHub
# release URLs and the one-line install from them must work, and
# https://playkeeper.io/install should run the new get.sh (a warning only,
# since that site runs on its own server).
# Pull requests that touch the release path, and manual runs, are dry runs:
# the same build, install and signing, without CurseForge's key and with a
# throwaway signing key, and nothing is released.
# Each release carries a tarball for x86_64 and one for 64-bit ARM. The
# Release check runs the ARM64 workflow (arm64.yml) on the assets it builds;
# dry runs run it on theirs, so pull requests exercise it the same way, and
# the live one-line install after publishing runs on both CPUs.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
      - CHANGELOG.md
      - cmd/release-sign/**
      - scripts/package.sh
      - scripts/release-*.sh
      - scripts/sign-release.sh
      - scripts/smoke-install.sh
      - scripts/third-party-notices.sh
      - THIRD_PARTY_NOTICES
      - packaging/**
      - Makefile
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to rehearse. Nothing is tagged or released.
        default: v0.0.0-dryrun

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"
  INSTALL_URL: https://playkeeper.io/install

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Dry run
    if: github.event_name != 'push'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ inputs.tag || 'v0.0.0-dryrun' }}

  arm64:
    name: ARM64 (dry run)
    needs: build
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/arm64.yml
    with:
      artifact: release-${{ needs.build.outputs.tag }}

  checked:
    name: The tagged commit passed CI and its Release check
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      title: ${{ steps.find.outputs.title }}
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: A green CI run and a green Release check of this version on this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAGGED: ${{ github.event_name == 'push' }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || needs.build.outputs.tag }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Use vMAJOR.MINOR.PATCH, optionally with a -suffix."
            exit 1
          fi
          version=${TAG#v}
          title="Playkeeper $TAG"
          if [[ $version == 0.* ]]; then title+=" (early release)"; fi
          # lookup WORKFLOW prints the id of its latest green run on this commit, or nothing.
          lookup() {
            gh run list --workflow "$1" --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' ||
              echo "::warning::$1 couldn't be looked up (not on the default branch yet, or GitHub didn't answer), so it counts as not run." >&2
          }
          missing=() how=()
          ci=$(lookup ci.yml)
          if [ -n "$ci" ]; then
            echo "CI passed on $SHA: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$ci" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            missing+=("green CI run")
            how+=("gh workflow run ci.yml --ref $TAG")
          fi
          check=$(lookup release-check.yml)
          built=
          if [ -n "$check" ]; then
            # A Release check uploads more artifacts than the API's default page
            # of 30, and lists the release build, its first, last.
            built=$(gh api "repos/$GH_REPO/actions/runs/$check/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | .name | select(startswith("release-")) | ltrimstr("release-")] | join(", ")') || built=
          fi
          if [[ ", $built, " == *", $TAG, "* ]]; then
            echo "The Release check built and checked $TAG on $SHA: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$check" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            missing+=("green Release check of $TAG${check:+ (the last green one on it built ${built:-no release assets})}")
            how+=("gh workflow run release-check.yml --ref $TAG -f version=$version")
          fi
          if [ "${#missing[@]}" -gt 0 ] && [ "$TAGGED" = true ]; then
            for i in "${!missing[@]}"; do echo "::error::$SHA has no ${missing[i]}. Run it: ${how[i]}"; done
            echo "A tag publishes only the release its commit's Release check built and checked. When what's missing has passed, re-run this workflow."
            exit 1
          fi
          for m in "${missing[@]}"; do echo "Dry run: $SHA has no $m; this goes on with this run's own build." | tee -a "$GITHUB_STEP_SUMMARY"; done
          run=$THIS_RUN
          if [ "$TAGGED" = true ]; then run=$check; fi
          { echo "tag=$TAG"; echo "version=$version"; echo "title=$title"; echo "run=$run"; } >>"$GITHUB_OUTPUT"

  publish:
    name: Sign and publish the checked assets
    needs: checked
    if: ${{ !cancelled() && needs.checked.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.checked.outputs.tag }}
      VERSION: ${{ needs.checked.outputs.version }}
      TITLE: ${{ needs.checked.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The assets the Release check built and checked (a dry run's own)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.checked.outputs.tag }}
          path: release
          run-id: ${{ needs.checked.outputs.run }}
          github-token: ${{ github.token }}
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: Sign the manifest with the release key, and check the assets again
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
          PLAYKEEPER_RELEASE_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.PLAYKEEPER_RELEASE_SIGNING_KEY || '' }}
        run: |
          scripts/sign-release.sh release/assets "$RUNNER_TEMP/release-keys.pub"
          scripts/release-check.sh release/assets "$VERSION" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-keys.pub"
      - name: Create a draft release with the seven assets
        if: github.event_name == 'push'
        working-directory: release/assets
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TITLE" --notes-file ../release-notes.md \
            get.sh playkeeper-linux-{amd64,arm64}.tar.gz{,.sha256} playkeeper-release.json playkeeper-release.json.sig
      - name: Check the draft carries exactly these assets
        if: github.event_name == 'push'
        run: |
          gh release download "$TAG" --dir draft
          diff <(ls release/assets) <(ls draft)
          for f in release/assets/*; do cmp "$f" "draft/${f##*/}"; done
      - name: Publish it as the latest release, not a pre-release
        if: github.event_name == 'push'
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest

  verify:
    name: Live addresses — one-line install on a fresh ${{ matrix.cpu }} runner
    needs: [checked, publish]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, cpu: x86_64 }
          - { runner: ubuntu-24.04-arm, cpu: ARM }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.checked.outputs.tag }}
      VERSION: ${{ needs.checked.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: releases/latest/download serves this release's assets
        run: |
          gh release download "$TAG" --dir /tmp/release
          latest=https://github.com/$GITHUB_REPOSITORY/releases/latest/download
          mkdir -p /tmp/latest
          for f in get.sh playkeeper-linux-{amd64,arm64}.tar.gz{,.sha256} playkeeper-release.json playkeeper-release.json.sig; do
            if ! curl -fsSL --retry 5 --retry-all-errors -o "/tmp/latest/$f" "$latest/$f"; then
              echo "::error::$latest/$f cannot be downloaded without signing in. Is the repository public?"
              exit 1
            fi
            cmp "/tmp/latest/$f" "/tmp/release/$f"
          done
      # playkeeper.io/install is a few lines that run the latest release's
      # get.sh (site/install.sh); the step's name stays, as the analytics
      # digest counts its download of get.sh by it.
      - name: playkeeper.io/install resolves to this release's get.sh (warning only)
        run: |
          if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/install "$INSTALL_URL" &&
            get=$(sed -n 's/^url=//p' /tmp/install) && [ "$get" = "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get.sh" ] &&
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/install-get.sh "$get" && cmp -s /tmp/install-get.sh /tmp/release/get.sh; then
            echo "$INSTALL_URL runs this release's get.sh"
          else
            answer=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$INSTALL_URL" 2>&1 || true)
            echo "::warning::$INSTALL_URL does not run this release's get.sh (it answered: $answer). Check the playkeeper.io application in Coolify (site/README.md) and its DNS. Installs from the GitHub release URL are not affected."
          fi
      - name: One-line install from the GitHub release
        run: scripts/smoke-install.sh "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get.sh" "$VERSION"
