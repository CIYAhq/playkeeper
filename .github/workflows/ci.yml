name: CI

# The fast checks, on every pull request and every push to main: lint and
# typecheck, the Go, agent, web and installer-script unit tests, the
# panel's unit tests under the race detector, and the dashboard's
# first-load budget when the change touches its code, side by side, then a
# job that checks they all passed. A pull request also crawls
# the pages of the dashboard it changes, through their modules or the Go
# code behind the API they call, and checks their accessibility and width
# (clickthrough.yml, test/e2e/ui/plan.ts), and runs the parts of the
# end-to-end workflow whose own files it changes (e2e.yml,
# scripts/ci-parts.sh); the OS matrix and ARM64 run by themselves when it
# changes installer or OS code. Once CI has passed on a pull request, a push
# to it crawls and runs those parts only for the files whose changes it
# changed since (scripts/ci-since.sh), so merging main, or changing the docs
# or CHANGELOG.md, runs the fast checks alone. A push to main also saves the
# played state pull requests' crawls start from, when it changes how that
# state is made or the newest one is more than a day old. The full suite, the
# full click-through included, runs once per release, in the Release check
# (release-check.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"

jobs:
  plan:
    name: Plan — the pages to click through, and the end-to-end parts the change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      selection: ${{ steps.plan.outputs.selection }}
      views: ${{ steps.plan.outputs.views }}
      matrix: ${{ steps.plan.outputs.matrix }}
      setup: ${{ steps.plan.outputs.setup }}
      parts: ${{ steps.parts.outputs.parts }}
      package: ${{ steps.parts.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own changes are measured from where it meets main.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: What this push changes that the pull request's last green CI didn't see
        id: since
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-since.sh ci.yml > "$RUNNER_TEMP/since"
      - name: What the change is measured from
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) if git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; fi ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: The pages the change touches
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
          MEASURED: ${{ steps.since.outputs.measured }}
        run: |
          if [ "$MEASURED" = true ]; then
            mapfile -t since < "$RUNNER_TEMP/since"
            .tools/node/bin/node test/e2e/ui/plan.ts --base "$BASE" --files "${since[@]}"
          elif [ -n "$BASE" ]; then
            .tools/node/bin/node test/e2e/ui/plan.ts --base "$BASE"
          else
            .tools/node/bin/node test/e2e/ui/plan.ts --full
          fi
      - name: The end-to-end parts it touches, and whether main's played state is due
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.base }}
          MODE: ${{ steps.plan.outputs.mode }}
          SETUP: ${{ steps.plan.outputs.setup }}
          MEASURED: ${{ steps.since.outputs.measured }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          parts=
          if [ "$EVENT" = pull_request ] && [ "$MEASURED" = true ]; then
            parts=$(scripts/ci-parts.sh < "$RUNNER_TEMP/since")
          elif [ "$EVENT" = pull_request ]; then
            parts=$(git diff --name-only --no-renames "$BASE" HEAD | scripts/ci-parts.sh)
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            newest=$(gh api "repos/$GH_REPO/actions/caches?key=played-state-&ref=refs/heads/main&sort=created_at&direction=desc&per_page=1" \
              --jq '.actions_caches[0].created_at // ""') || newest=
            if [ "$SETUP" = fresh ]; then
              echo "This push changes how the played state is made, so main saves a new one."
              parts=install-and-play
            elif [ -z "$newest" ] || [ "$(date -d "$newest" +%s)" -lt "$(($(date +%s) - 86400))" ]; then
              echo "Main's newest played state was saved ${newest:-never}, more than a day ago, so main saves a new one."
              parts=install-and-play
            fi
          fi
          package=false
          if { [ "$EVENT" = pull_request ] && [ "$MODE" != none ]; } || [[ ",$parts," =~ ,(install-and-play|restore|views|core-flows), ]]; then
            package=true
          fi
          echo "End-to-end parts: ${parts:-none}"
          { echo "parts=$parts"; echo "package=$package"; } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint — gofmt, go vet, ESLint, TypeScript, THIRD_PARTY_NOTICES, shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains (same command contributors run)
        run: ./scripts/setup.sh
      - name: make lint typecheck
        run: make lint typecheck
      - name: make lint-sh
        run: make lint-sh

  go-tests:
    name: Go unit tests, every package but the agent's
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make test-go-other
        run: make test-go-other

  agent-tests:
    name: Agent unit tests — 16 shards side by side, every test run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make test-agent
        run: make test-agent OUT=/tmp/agent-tests

  # Under the race detector the panel's tests would keep every core of one
  # runner busy for longer than the other jobs take, so two runners each run
  # four of eight shards side by side.
  panel-race:
    name: Panel unit tests under the race detector — runner ${{ matrix.part }} of 2, every test run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make test-panel-race
        env:
          PART: ${{ matrix.part }}/2
        run: make test-panel-race JOBS=8 OUT=/tmp/panel-race

  # The web and installer-script unit tests, then the first-load budget: a
  # production build of the dashboard, about a second, which fails when a
  # page loads more than web/src/lib/first-load.ts allows. It runs on every
  # push to main and on a pull request that changes the dashboard's code,
  # every time, since main moving under it changes what its merge builds.
  web-tests:
    name: Web and installer-script unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's run is on its merge with main, whose first parent is main.
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make test-web test-sh
        run: make test-web test-sh
      - name: Whether the change touches the dashboard's code
        id: web
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(web/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dashboard code changed."
          fi
      - name: make web-budget
        if: steps.web.outputs.run == 'true'
        run: make web-budget

  # The plugins Playkeeper ships inside its binary (plugins/, embedded from
  # internal/addons/firstparty): their unit tests, and the jars checked
  # against a fresh build, which is reproducible. A pull request that touches
  # neither skips both.
  plugins:
    name: Plugins — their tests, and the jars Playkeeper embeds checked against their sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether the change touches a plugin or its jar
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE"...HEAD | grep -qE '^(plugins/|internal/addons/firstparty/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No plugin or jar changed."
          fi
      - name: make plugins, with the runner's Java 21
        if: steps.changed.outputs.run == 'true'
        run: JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH" make plugins
      - name: The jars Playkeeper embeds are what their sources build
        if: steps.changed.outputs.run == 'true'
        run: git diff --exit-code --stat -- internal/addons/firstparty/

  check:
    name: Lint, typecheck and unit tests — every job passed
    needs: [lint, go-tests, agent-tests, panel-race, web-tests, plugins]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null

  package:
    name: Package — the release tarball the crawl and the end-to-end parts install
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make package
        run: make package
      - name: Inspect the artifact outside the checkout
        run: |
          mkdir -p /tmp/artifact
          cp dist/playkeeper-*-linux-amd64.tar.gz dist/playkeeper-*-linux-amd64.tar.gz.sha256 /tmp/artifact/
          cd /tmp/artifact
          sha256sum -c ./*.sha256
          tar -tzvf ./*.tar.gz
          if tar -tzf ./*.tar.gz | grep -Ei '\.(jar|pem|key|env|db|sqlite)$|/\.git'; then echo "unexpected file in artifact"; exit 1; fi
          tar -xzf ./*.tar.gz
          ./playkeeper-*/playkeeper version
          file ./playkeeper-*/playkeeper
          cmp "$GITHUB_WORKSPACE"/dist/playkeeper-*-linux-amd64.tar.gz "$GITHUB_WORKSPACE/dist/playkeeper-linux-amd64.tar.gz"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum -c playkeeper-linux-amd64.tar.gz.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/playkeeper-*-linux-amd64.tar.gz*
            dist/playkeeper-linux-amd64.tar.gz*
            dist/get.sh
          retention-days: 7

  clickthrough:
    name: Click-through
    needs: [plan, package]
    if: github.event_name == 'pull_request' && (needs.plan.outputs.mode == 'pages' || needs.plan.outputs.mode == 'full')
    uses: ./.github/workflows/clickthrough.yml
    with:
      artifact: release
      selection: ${{ needs.plan.outputs.selection }}
      views: ${{ needs.plan.outputs.views }}
      matrix: ${{ needs.plan.outputs.matrix }}
      setup: ${{ needs.plan.outputs.setup }}

  e2e:
    name: End to end
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.parts != '' && needs.package.result != 'failure' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      parts: ${{ needs.plan.outputs.parts }}
      artifact: ${{ needs.package.result == 'success' && 'release' || '' }}
      setup: ${{ needs.plan.outputs.setup }}
