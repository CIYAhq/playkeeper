name: End to end

# The end-to-end checks, each on a fresh runner: install this build, walk the
# keyboard onboarding, play with two protocol bots, back up and uninstall; a
# second runner installs with the one-line installer and restores that
# backup; every page's accessibility and width, and the keyboard checks, on a
# played install; the core flows at desktop and phone sizes, with the usage
# stats they send; the current release upgraded to this build, updated from
# the dashboard, and a broken update rolled back; the playkeeper.io, names
# and stats service images; certificates from Pebble; the browser checks
# against a faked panel; and the Whop store site, built and run in workerd.
# The Release check runs every part on the release it builds
# (release-check.yml). Pull requests run only the parts whose own files they
# change, and pushes to main only the first runner, when the played state
# pull requests' crawls start from is due (ci.yml, scripts/ci-parts.sh).
# Started by hand, it runs the parts asked for on the branch it's started on.

on:
  workflow_call:
    inputs:
      parts:
        description: The parts to run, comma-separated as scripts/ci-parts.sh prints them, or all
        type: string
        default: all
      artifact:
        description: The artifact with the release tarball, its .sha256 and get.sh; empty builds this commit
        type: string
        default: ""
      assets:
        description: The folder in that artifact they are in
        type: string
        default: ""
      setup:
        description: What the views check starts from, as for .github/actions/played-install (saved or fresh)
        type: string
        default: saved
  workflow_dispatch:
    inputs:
      parts:
        description: The parts to run, comma-separated (install-and-play, restore, views, core-flows, update, site, names, stats, certs, fake-panel, whop-store), or all
        type: string
        default: all

permissions:
  contents: read

env:
  FORCE_COLOR: "0"

jobs:
  package:
    name: Package — the release tarball the end-to-end jobs install
    if: >-
      !inputs.artifact && (inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',install-and-play,') ||
      contains(format(',{0},', inputs.parts), ',restore,') || contains(format(',{0},', inputs.parts), ',views,') ||
      contains(format(',{0},', inputs.parts), ',core-flows,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: make package
        run: make package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/playkeeper-*-linux-amd64.tar.gz*
            dist/playkeeper-linux-amd64.tar.gz*
            dist/get.sh
          retention-days: 7

  install-and-play:
    name: Fresh runner — install, onboarding, two bots, backup, uninstall
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' && (inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',install-and-play,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASSETS: /tmp/release/${{ inputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact || 'release' }}
          path: /tmp/release
      - name: Test tools (Node for the protocol bots and the browser tests)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd test/e2e/bot && ../../../.tools/node/bin/npm ci --no-audit --no-fund)
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: Install from the release tarball (outside the checkout)
        run: |
          mkdir -p /tmp/evidence /tmp/install
          (cd "$ASSETS" && sha256sum -c playkeeper-linux-amd64.tar.gz.sha256)
          tar -xzf "$ASSETS/playkeeper-linux-amd64.tar.gz" -C /tmp/install
          cd /tmp/install/playkeeper-*-linux-amd64
          sudo ./playkeeper preflight | tee /tmp/evidence/preflight.txt
          start=$(date +%s)
          sudo DO_NOT_TRACK=1 ./install.sh --yes | tee /tmp/evidence/install.txt
          echo "install wall time: $(( $(date +%s) - start )) s" | tee -a /tmp/evidence/install.txt
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}' > /tmp/evidence/code
      - name: Enable the offline test harness (protocol bots have no Mojang accounts)
        run: |
          sudo mkdir -p /etc/systemd/system/playkeeper-agent.service.d
          printf '[Service]\nEnvironment=PLAYKEEPER_E2E_OFFLINE_MODE_UNSAFE=1\n' | sudo tee /etc/systemd/system/playkeeper-agent.service.d/e2e-offline.conf
          sudo systemctl daemon-reload
          sudo systemctl restart playkeeper-agent
      - name: Keyboard-only onboarding in the browser
        timeout-minutes: 10
        env:
          PK_URL: https://127.0.0.1:8443
          PK_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PK_SHOTS: /tmp/evidence/screenshots
          PK_OUT: /tmp/evidence/ui
        run: |
          export PK_SETUP_CODE="$(cat /tmp/evidence/code)"
          cd test/e2e/ui && npx playwright test onboarding.spec.ts --reporter=list
      - name: Protocol bots, sessions, console, backup and download
        timeout-minutes: 10
        env:
          PK_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 test/e2e/scenario.py host-a --existing --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem \
            --code "$(cat /tmp/evidence/code)" --game-host "$(cat /tmp/evidence/ui/join-address.txt)" --out /tmp/evidence/a
      # At once, for the second runner, which waits for it (restore-second-host).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-backup
          path: |
            /tmp/evidence/a/world-backup.tar.gz
            /tmp/evidence/a/marker.json
            /tmp/evidence/a/host-a-results.json
          retention-days: 7
      - name: Exposure and privilege checks
        run: |
          set -x
          sudo ss -ltnup
          stat -c '%A %U:%G %n' /run/playkeeper/agent.sock
          ps -o user=,pid=,cmd= -C playkeeper
          id playkeeper
          panel=$(pgrep -f 'playkeeper panel')
          test "$(sudo ls -l /proc/$panel/fd | grep -c docker.sock)" = 0
          if sudo -u playkeeper curl -sS --unix-socket /var/run/docker.sock http://d/version; then echo "panel user can reach Docker"; exit 1; fi
          test "$(sudo -u playkeeper curl -sS -o /dev/null -w '%{http_code}' -X POST --unix-socket /run/playkeeper/agent.sock http://a/v1/rm)" = 404
          container=$(sudo docker ps -a --filter label=io.playkeeper.managed=true --filter label=io.playkeeper.server --format '{{.Names}}')
          test "$(echo "$container" | wc -w)" = 1
          sudo docker inspect "$container" --format 'Privileged={{.HostConfig.Privileged}} CapAdd={{.HostConfig.CapAdd}} CapDrop={{.HostConfig.CapDrop}} Memory={{.HostConfig.Memory}} User={{.Config.User}} Ports={{json .HostConfig.PortBindings}}'
          sudo sh -c "grep -E '^(online-mode|white-list|enforce-whitelist|log-ips)=' /var/lib/playkeeper/servers/*/data/server.properties"
          curl -sS -i http://127.0.0.1:8443/ | head -1
      # The state after the onboarding and the bots, for pull requests'
      # crawls to start from: main saves one when it's due (ci.yml), and a pull
      # request that runs this part one for its later pushes (a key is saved
      # once, and a state is a few hundred MB). Other branches' caches aren't
      # visible to pull requests, so they save none. It names the commit it was
      # made on, a pull request's head rather than its merge commit, so later
      # commits can tell they contain it.
      - name: The key of this run's played state
        id: played
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          KEY: played-state-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('{0}-{1}', github.sha, github.run_attempt) }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Whether it's saved already
        id: saved
        if: steps.played.outputs.key
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/played
          key: ${{ steps.played.outputs.key }}
          lookup-only: true
      - name: Save the played state
        if: steps.played.outputs.key && steps.saved.outputs.cache-hit != 'true'
        env:
          PK_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/e2e/played-state.sh save /tmp/played "$PK_ADMIN_PASSWORD" "$COMMIT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.played.outputs.key && steps.saved.outputs.cache-hit != 'true'
        with:
          path: /tmp/played
          key: ${{ steps.played.outputs.key }}
      - name: Uninstall keeps the world and backups
        run: |
          worlds() { sudo sh -c 'find /var/lib/playkeeper/servers/*/data/world /var/lib/playkeeper/backups -type f -exec sha256sum {} +' | sort -k2; }
          worlds > /tmp/evidence/data-before.txt
          test -s /tmp/evidence/data-before.txt
          sudo playkeeper uninstall --yes | tee /tmp/evidence/uninstall.txt
          worlds > /tmp/evidence/data-after.txt
          diff /tmp/evidence/data-before.txt /tmp/evidence/data-after.txt
          if systemctl list-unit-files | grep playkeeper; then echo "units left behind"; exit 1; fi
          if sudo ss -ltnH | grep -E ':(8443|25565) '; then echo "listeners left behind"; exit 1; fi
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/ui/browser-session.json /tmp/evidence/a/state-a.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-host-a
          path: /tmp/evidence
          retention-days: 7

  # It starts beside install-and-play, installs, then waits for its backup.
  restore-second-host:
    name: Second fresh runner — one-line install, restore the backup, verify the marker
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' && (inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',restore,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      ASSETS: /tmp/release/${{ inputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact || 'release' }}
          path: /tmp/release
      - name: Test tools (Node for the protocol bot)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd test/e2e/bot && ../../../.tools/node/bin/npm ci --no-audit --no-fund)
      - name: One-line install (get.sh) from a local mirror of the release assets
        run: |
          set -o pipefail
          mkdir -p /tmp/evidence /tmp/mirror/bad
          cp "$ASSETS/get.sh" "$ASSETS/playkeeper-linux-amd64.tar.gz" "$ASSETS/playkeeper-linux-amd64.tar.gz.sha256" /tmp/mirror/
          cp "$ASSETS/playkeeper-linux-amd64.tar.gz" /tmp/mirror/bad/
          printf '%064d  playkeeper-linux-amd64.tar.gz\n' 0 > /tmp/mirror/bad/playkeeper-linux-amd64.tar.gz.sha256
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/mirror > /tmp/evidence/mirror-log.txt 2>&1 &
          sleep 1
          if curl -fsSL http://127.0.0.1:8765/get.sh | sudo DO_NOT_TRACK=1 PLAYKEEPER_BASE_URL=http://127.0.0.1:8765/bad PLAYKEEPER_ALLOW_HTTP=1 sh -s -- --yes 2>&1 | tee /tmp/evidence/oneliner-bad-checksum.txt; then
            echo "a tarball with a wrong checksum was installed"; exit 1
          fi
          grep -q 'does not match its published checksum' /tmp/evidence/oneliner-bad-checksum.txt
          test ! -e /usr/local/bin/playkeeper
          curl -fsSL http://127.0.0.1:8765/get.sh | sudo DO_NOT_TRACK=1 PLAYKEEPER_BASE_URL=http://127.0.0.1:8765 PLAYKEEPER_ALLOW_HTTP=1 sh -s -- --yes | tee /tmp/evidence/install.txt
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}' > /tmp/evidence/code
          sudo mkdir -p /etc/systemd/system/playkeeper-agent.service.d
          printf '[Service]\nEnvironment=PLAYKEEPER_E2E_OFFLINE_MODE_UNSAFE=1\n' | sudo tee /etc/systemd/system/playkeeper-agent.service.d/e2e-offline.conf
          sudo systemctl daemon-reload && sudo systemctl restart playkeeper-agent
      - name: The first runner's backup, as soon as it has one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: Fresh runner — install, onboarding, two bots, backup, uninstall
        run: |
          for _ in $(seq 180); do
            if gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx world-backup; then exit 0; fi
            # The step runs under bash -e, so a lookup the API fails would end it:
            # it is asked again next time round, as the artifacts are. Called
            # from another workflow, the job's name starts with the caller's.
            state=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == env.JOB or (.name | endswith(" / " + env.JOB))) | "\(.status) \(.conclusion // "")"') || state=
            case $state in
              "completed success") exit 0 ;;
              completed*)
                echo "::error::$JOB ended ($state) without a backup to restore."
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::$JOB uploaded no backup in 15 minutes."
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-backup
          path: /tmp/backup
      - name: Guarded restore and marker verification (console and client view)
        env:
          PK_ADMIN_PASSWORD: ci-b-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sha=$(python3 -c "import json; print(json.load(open('/tmp/backup/host-a-results.json'))['backup']['sha256'])")
          python3 test/e2e/scenario.py host-b --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --code "$(cat /tmp/evidence/code)" \
            --game-host 127.0.0.1 --archive /tmp/backup/world-backup.tar.gz --marker /tmp/backup/marker.json --expect-sha256 "$sha" --out /tmp/evidence/b
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/b/state-b.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-host-b
          path: /tmp/evidence
          retention-days: 7

  views:
    name: Fresh runner — every page's accessibility and width, and the keyboard checks, on a played install
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' && (inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',views,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact || 'release' }}
          path: /tmp/release
      - name: Test tools (Node for the protocol bots and the browser tests)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd test/e2e/bot && ../../../.tools/node/bin/npm ci --no-audit --no-fund)
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: A played install of this build
        uses: ./.github/actions/played-install
        with:
          assets: /tmp/release/${{ inputs.assets }}
          setup: ${{ inputs.setup || 'saved' }}
          password: ci-v-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Every view, accessibility and keyboard checks
        env:
          PK_URL: https://127.0.0.1:8443
          PK_SHOTS: /tmp/evidence/screenshots
          PK_OUT: /tmp/evidence/ui
        run: cd test/e2e/ui && npx playwright test views.spec.ts --reporter=list
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/ui/browser-session.json /tmp/evidence/a/state-a.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-views
          path: /tmp/evidence
          retention-days: 7

  core-flows:
    name: Fresh runner — the core flows at desktop and phone sizes (sign in, create a server, start it, back it up)
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'failure' && (inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',core-flows,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASSETS: /tmp/release/${{ inputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact || 'release' }}
          path: /tmp/release
      - name: Test tools (Node and the test browser)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: Install from the release tarball, and its admin (the keyboard onboarding runs in install-and-play); usage stats go to a local recorder
        env:
          PK_PASSWORD: ci-c-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/evidence /tmp/install
          nohup python3 "$GITHUB_WORKSPACE/test/e2e/stats_recorder.py" serve 8766 /tmp/evidence/stats.jsonl >/dev/null 2>&1 &
          (cd "$ASSETS" && sha256sum -c playkeeper-linux-amd64.tar.gz.sha256)
          tar -xzf "$ASSETS/playkeeper-linux-amd64.tar.gz" -C /tmp/install
          cd /tmp/install/playkeeper-*-linux-amd64
          sudo PLAYKEEPER_STATS_URL=http://127.0.0.1:8766 ./install.sh --yes | tee /tmp/evidence/install.txt
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          code=$(grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}')
          python3 "$GITHUB_WORKSPACE/test/e2e/pkclient.py" --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --state /tmp/evidence/state.json setup "$code" admin "$PK_PASSWORD" >/dev/null
      - name: Core flows at desktop and phone sizes — sign in, create a server, start it, back it up
        timeout-minutes: 10
        env:
          PK_URL: https://127.0.0.1:8443
          PK_PASSWORD: ci-c-${{ github.run_id }}-${{ github.run_attempt }}
          PK_SHOTS: /tmp/evidence/screenshots
        run: cd test/e2e/ui && npx playwright test smoke.spec.ts --reporter=list
      - name: Usage stats — the installer's reports and the agent's first heartbeat, marked as a test, with only the fields README.md lists
        env:
          # A release build, which the Release check hands over in its assets
          # folder, says it came from its tarball; CI's own builds, from the source.
          SOURCE: ${{ inputs.assets != '' && 'tarball' || 'source' }}
        run: |
          for _ in $(seq 60); do grep -q '"/v1/heartbeat"' /tmp/evidence/stats.jsonl 2>/dev/null && break; sleep 2; done
          python3 test/e2e/stats_recorder.py check /tmp/evidence/stats.jsonl /etc/playkeeper/config.json "$(playkeeper version | awk '{print $2}')" "$SOURCE"
      - name: Collect evidence
        if: failure()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/state.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: evidence-core-flows
          path: /tmp/evidence
          retention-days: 7

  update:
    name: Fresh runner — current release, upgrade and dashboard update to this build, failed update rolls back
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',update,')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PK_ADMIN_PASSWORD: ci-u-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: Install the current release with its one-line installer from GitHub
        run: |
          set -o pipefail
          mkdir -p /tmp/evidence/update
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/get.sh" | sudo DO_NOT_TRACK=1 sh -s -- --yes | tee /tmp/evidence/install-release.txt
          playkeeper version | tee /tmp/evidence/release-version.txt
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install-release.txt | awk '{print $3}' > /tmp/evidence/code
      - name: Start building this commit as signed test releases (a signing key made for this run only)
        run: |
          current=$(playkeeper version | awk '{print $2}')
          IFS=. read -r major minor patch <<<"${current%%[-+]*}"
          base="$major.$minor.$((patch + 1))"
          { echo "PK_A=$base-ci.1"; echo "PK_B=$base-ci.2"; echo "PK_C=$base-ci.3"; } >> "$GITHUB_ENV"
          # They build while the next step gives the current release its data.
          # shellcheck disable=SC2016 # the inner script's own $BASE
          BASE=$base nohup bash -c '
            scripts/e2e/update-releases.sh /tmp/releases key &&
              scripts/e2e/update-releases.sh /tmp/releases build a "$BASE-ci.1" &&
              scripts/e2e/update-releases.sh /tmp/releases build b "$BASE-ci.2"
            echo $? > /tmp/releases-built' > /tmp/evidence/build-releases.txt 2>&1 &
      - name: Give the current release data to keep (settings, world marker, backup)
        run: |
          python3 test/e2e/update.py prepare --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update \
            --code "$(cat /tmp/evidence/code)"
          sudo find /var/lib/playkeeper/backups -type f -exec sha256sum {} + | sort -k2 > /tmp/evidence/backups-before.txt
      - name: The signed test releases are built
        timeout-minutes: 8
        run: |
          until [ -e /tmp/releases-built ]; do sleep 2; done
          cat /tmp/evidence/build-releases.txt
          test "$(cat /tmp/releases-built)" = 0
      - name: Serve the test releases on 127.0.0.1:8765 (a/ for the one-line installer, latest/ for update checks)
        run: |
          mkdir -p /tmp/mirror/latest
          cp -r /tmp/releases/a /tmp/mirror/a
          cp /tmp/releases/b/* /tmp/mirror/latest/
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/mirror > /tmp/evidence/mirror-log.txt 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8765/latest/playkeeper-release.json
      - name: One-line upgrade from the current release to this build keeps everything
        run: |
          set -o pipefail
          curl -fsSL http://127.0.0.1:8765/a/get.sh | sudo DO_NOT_TRACK=1 PLAYKEEPER_BASE_URL=http://127.0.0.1:8765/a PLAYKEEPER_ALLOW_HTTP=1 \
            sh -s -- --yes --release-url http://127.0.0.1:8765/latest | tee /tmp/evidence/upgrade.txt
          grep -q "upgrades it to $PK_A in place" /tmp/evidence/upgrade.txt
          test "$(playkeeper version | awk '{print $2}')" = "$PK_A"
          systemctl is-enabled playkeeper-update.path && systemctl is-active playkeeper-update.path
          python3 test/e2e/update.py verify --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update --expect-version "$PK_A"
      - name: Update from the dashboard to the next build
        run: |
          python3 test/e2e/update.py update --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update --to "$PK_B"
          test "$(playkeeper version | awk '{print $2}')" = "$PK_B"
          python3 test/e2e/update.py verify --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update --expect-version "$PK_B"
      - name: A signed release that never comes up healthy is rolled back automatically
        run: |
          sudo playkeeper units --config /etc/playkeeper/config.json > /tmp/releases/units.json
          scripts/e2e/update-releases.sh /tmp/releases broken c "$PK_C" /tmp/releases/units.json
          rm -f /tmp/mirror/latest/*
          cp /tmp/releases/c/* /tmp/mirror/latest/
          installed() { sudo sha256sum /usr/local/bin/playkeeper /etc/playkeeper/config.json /etc/systemd/system/playkeeper-*; }
          installed > /tmp/evidence/installed-before-rollback.txt
          python3 test/e2e/update.py update --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update --to "$PK_C" --expect rolled_back
          installed > /tmp/evidence/installed-after-rollback.txt
          diff /tmp/evidence/installed-before-rollback.txt /tmp/evidence/installed-after-rollback.txt
          sudo journalctl -u playkeeper-update --no-pager | grep -q "Result: rolled_back"
          python3 test/e2e/update.py verify --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --out /tmp/evidence/update --expect-version "$PK_B"
          sudo find /var/lib/playkeeper/backups -type f -exec sha256sum {} + | sort -k2 > /tmp/evidence/backups-after.txt
          diff /tmp/evidence/backups-before.txt /tmp/evidence/backups-after.txt
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          sudo journalctl -u playkeeper-update --no-pager > /tmp/evidence/updater.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/update/state.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install-release.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-update
          path: /tmp/evidence
          retention-days: 7

  site:
    name: Site image — build it, check every page, /sizing, /demo/, /t, /healthz and the /install script, walk the live demo
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',site,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the playkeeper.io image and check what it serves
        run: scripts/site-check.sh
      - name: Test tools (Node, Chromium and WebKit for the live demo checks)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium webkit
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium webkit
      - name: Walk the live demo in the site image (Home, a server's pages, Settings, a restart; no request leaves the page)
        run: |
          docker run -d --name playkeeper-demo -p 127.0.0.1:8460:80 playkeeper-site:check
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8460/healthz && break; sleep 1; done
          cd test/e2e/ui
          PK_DEMO_URL=http://127.0.0.1:8460/demo/ PK_SHOTS=/tmp/demo-shots npx playwright test demo.spec.ts --reporter=list
      - name: The live demo in Safari on an iPhone (leaving it while its code loads, and a new version reloading it)
        run: cd test/e2e/ui && PK_DEMO_URL=http://127.0.0.1:8460/demo/ npx playwright test demo-iphone.spec.ts --reporter=list
      - name: Stop the demo
        if: always()
        run: docker rm -f playkeeper-demo || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-demo-screenshots
          path: /tmp/demo-shots
          if-no-files-found: ignore
          retention-days: 7

  names:
    name: Names service image — build it, check its API, health check and non-root user
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',names,')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the names service image and check what it serves
        run: scripts/names-check.sh

  stats:
    name: Stats service image — build it, check its API, that it keeps no address, its health check and non-root user
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',stats,')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the stats service image and check what it serves and keeps
        run: scripts/stats-check.sh

  acme-pebble:
    name: Certificates from Pebble, Let's Encrypt's test CA (HTTP-01 and DNS-01)
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',certs,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: Install Pebble and pebble-challtestsrv v2.10.1 (module checksums verified against sum.golang.org)
        run: |
          GOBIN="$RUNNER_TEMP/pebble" .tools/go/bin/go install \
            github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
      - name: Get certificates from Pebble, and its problems explained
        env:
          PLAYKEEPER_PEBBLE_DIR: ${{ runner.temp }}/pebble
        run: .tools/go/bin/go test -count=1 -run '^TestPebble$' -v ./internal/certs/

  ui-fake-panel:
    name: Browser checks against a faked panel — the Console with a long log, desktop and phone; the stats dashboard; the click-through's own checks
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',fake-panel,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchains, the built UI and the test browser
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          make web
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: Console scrolling, following and "Jump to latest"
        run: cd test/e2e/ui && npx playwright test -c playwright.fake-panel.config.ts
      - name: playkeeper.io on desktop and phone — nothing wider than the screen, no serious accessibility violations
        run: cd test/e2e/ui && npx playwright test -c playwright.site.config.ts
      - name: The stats dashboard against the stats service — sign-in, the token kept in the browser alone, the counts, a phone
        run: cd test/e2e/ui && npx playwright test -c playwright.stats.config.ts
      - name: The click-through's own checks — its verdicts, the recorded fixtures, which pages a change touches, the split and the gate
        run: cd test/e2e/ui && npx playwright test clickthrough.spec.ts --grep-invert "every control does something on" --reporter=list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ui-fake-panel-traces
          path: test/e2e/ui/test-results
          retention-days: 7

  whop-store:
    name: Whop store site — build it, run the build in workerd against a fake Whop, check its pages at desktop and phone sizes
    if: inputs.parts == 'all' || contains(format(',{0},', inputs.parts), ',whop-store,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchains, the store's dependencies and the test browser
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd services/whop-store && ../../.tools/node/bin/npm ci --no-audit --no-fund)
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: Typecheck, unit tests and the build Whop hosting deploys
        run: |
          cd services/whop-store
          npm run typecheck
          npm test
          npm run build
          unzip -p dist/whop-build.zip manifest.json | grep -qF '"entry":"index.js"'
          unzip -Z1 dist/whop-build.zip | grep -qx 'client/store.css'
      - name: The built store in workerd against a fake Whop, in a browser (plans, a fresh copy, terms, a 404, Whop unreachable)
        run: cd test/e2e/ui && npx playwright test -c playwright.whop-store.config.ts --reporter=list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: whop-store-traces
          path: test/e2e/ui/test-results
          retention-days: 7
