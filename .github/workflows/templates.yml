name: Templates

# Creates and starts a real server from each of playkeeper.io's templates
# (site/data/templates) on the latest Playkeeper release, with
# cmd/template-check. It's a scheduled job: every night and when a release
# comes out it checks them all, and files an issue naming any that fail; the
# scheduled template agent then fixes their pins or holds them in a PR. On a
# pull request it checks only the templates the change adds or changes, and
# fails when site/data/checks doesn't list what installed. See
# site/README.md, "Template library".
# A release starts it through the Release workflow, which publishes with its
# own token, and a release published that way starts no other workflow. Only
# Release's successful run on a tag checks the templates; its failed runs and
# its dry runs, for pull requests and by hand, start a run that checks
# nothing.

on:
  pull_request:
    paths:
      - site/data/templates/**
      - site/data/library/**
      - site/data/checks/**
  schedule:
    - cron: "30 2 * * *"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      only:
        description: Template ids, comma-separated (empty checks them all)
        required: false
      thumbnails:
        description: Template ids to make thumbnails of, comma-separated (empty makes them for templates without one)
        required: false

permissions:
  contents: read

concurrency:
  # Every run after a Release run is on the default branch, so one that checks
  # nothing gets a group of its own and cancels no check.
  group: templates-${{ github.event_name == 'workflow_run' && !(github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"

jobs:
  list:
    name: Templates to check — the ones a pull request changes, or all of them
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      only: ${{ steps.list.outputs.only }}
      count: ${{ steps.list.outputs.count }}
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the templates and split them into shards
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ONLY: ${{ inputs.only }}
        run: |
          all=$(find site/data/templates -maxdepth 1 -name '*.json' ! -name cards.json -printf '%f\n' | sed 's/\.json$//' | sort)
          only=
          ids=$all
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            ids=$(sed -nE 's#^site/data/(templates|checks)/([a-z0-9-]+)\.json$#\2#p' <<<"$changed")
            for f in $(grep -E '^site/data/library/[a-z0-9-]+\.json$' <<<"$changed" || true); do
              [ -f "$f" ] && ids="$ids"$'\n'"$(sed -nE 's/.*"template": *"([^"]+)".*/\1/p' "$f")"
            done
            ids=$(grep -v -e '^$' -e '^cards$' <<<"$ids" | sort -u | while read -r id; do [ -f "site/data/templates/$id.json" ] && echo "$id"; done || true)
            only=$(paste -sd, <<<"$ids")
          elif [ -n "$ONLY" ]; then
            only=$ONLY
            ids=$(tr , '\n' <<<"$ONLY")
          fi
          count=$(grep -c . <<<"$ids" || true)
          shards=$(( (count + 5) / 6 ))
          [ "$shards" -gt 20 ] && shards=20
          [ "$shards" -lt 1 ] && shards=1
          {
            echo "only=$only"
            echo "count=$count"
            echo "shards=[$(seq -s, 1 "$shards")]"
          } >> "$GITHUB_OUTPUT"
          echo "$count templates in $shards shards: ${only:-all of them}"

  check:
    name: Template check ${{ matrix.shard }} of ${{ strategy.job-total }} — create, start and read each server on the latest release
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.list.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: The Playkeeper release people install (the new one, for a release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          mkdir -p /tmp/release
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern 'playkeeper-linux-amd64.tar.gz*' --dir /tmp/release
          cd /tmp/release
          sha256sum -c playkeeper-linux-amd64.tar.gz.sha256
          tar -xzf playkeeper-linux-amd64.tar.gz
      - name: Run it in dev mode (panel and agent on this runner's Docker, nothing installed)
        run: |
          pk=$(ls -d /tmp/release/playkeeper-*-linux-amd64)/playkeeper
          nohup "$pk" dev --dir /tmp/pk > /tmp/pk.log 2>&1 &
          for _ in $(seq 60); do [ -S /tmp/pk/agent.sock ] && break; sleep 1; done
          [ -S /tmp/pk/agent.sock ] || { cat /tmp/pk.log; exit 1; }
      - name: Check the templates
        env:
          ONLY: ${{ needs.list.outputs.only }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          VERIFY: ${{ github.event_name == 'pull_request' && '-verify' || '' }}
        run: make template-check SOCKET=/tmp/pk/agent.sock ARGS="-only '$ONLY' -shard $SHARD -out /tmp/results.json $VERIFY"
      - name: Keep the results and Playkeeper's log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templates-${{ matrix.shard }}
          path: |
            /tmp/results.json
            /tmp/pk.log
          if-no-files-found: ignore
          retention-days: 14

  # Thumbnails come from each template's real world: a bot joins its server
  # and saves the land around spawn, or the mode's showpiece, and
  # site/tools/thumbnails renders it. A server the bot can't join, like a
  # NeoForge or Forge pack's, is read from the world it saved. The bot joins
  # as a player would, so this job's Playkeeper runs servers in offline mode,
  # on a runner thrown away afterwards. Nightly it makes them for templates
  # without one; the scheduled template agent looks at them and commits them
  # from the artifact. Like the check, it runs third-party plugins with
  # read-only access; thumbnails-report files the issue.
  thumbnails:
    name: Thumbnails of templates without one, from their real worlds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      made: ${{ steps.made.outputs.made }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the templates
        id: pick
        env:
          ONLY: ${{ inputs.thumbnails }}
        run: |
          if [ -n "$ONLY" ]; then
            ids=$(tr , '\n' <<<"$ONLY")
          else
            # Every template without a thumbnail, until one is committed.
            ids=$(find site/data/templates -maxdepth 1 -name '*.json' ! -name cards.json -printf '%f\n' | sed 's/\.json$//' | sort |
              while read -r id; do
                [ -f "site/static/shots/templates/$id-960w.webp" ] || echo "$id"
              done)
          fi
          echo "only=$(paste -sd, <<<"$ids")" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . <<<"$ids" || true)" >> "$GITHUB_OUTPUT"
          echo "Thumbnails for: ${ids:-none}"
      - name: Set up pinned toolchains, and Pillow for AVIF
        if: steps.pick.outputs.count != '0'
        run: |
          ./scripts/setup.sh
          python3 -m pip install --user --quiet 'pillow>=11.3'
      - name: The Playkeeper release people install
        if: steps.pick.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/release
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'playkeeper-linux-amd64.tar.gz*' --dir /tmp/release
          cd /tmp/release
          sha256sum -c playkeeper-linux-amd64.tar.gz.sha256
          tar -xzf playkeeper-linux-amd64.tar.gz
      - name: Run it in dev mode, its servers in offline mode for the capture bot
        if: steps.pick.outputs.count != '0'
        run: |
          pk=$(ls -d /tmp/release/playkeeper-*-linux-amd64)/playkeeper
          PLAYKEEPER_E2E_OFFLINE_MODE_UNSAFE=1 nohup "$pk" dev --dir /tmp/pk > /tmp/pk.log 2>&1 &
          for _ in $(seq 60); do [ -S /tmp/pk/agent.sock ] && break; sleep 1; done
          [ -S /tmp/pk/agent.sock ] || { cat /tmp/pk.log; exit 1; }
      - name: Capture and render
        if: steps.pick.outputs.count != '0'
        env:
          ONLY: ${{ steps.pick.outputs.only }}
        run: make template-thumbnails SOCKET=/tmp/pk/agent.sock SHOTS=/tmp/shots ARGS="-only '$ONLY'"
      - name: Keep the thumbnails and Playkeeper's log
        if: always() && steps.pick.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-thumbnails
          path: |
            site/static/shots/templates/
            web/src/assets/template-thumbs/
            /tmp/pk.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Which templates have new thumbnails
        id: made
        if: always() && steps.pick.outputs.count != '0'
        run: |
          made=$(git status --porcelain --untracked-files=all site/static/shots/templates | sed -nE 's#.*site/static/shots/templates/([a-z0-9-]+)-960w\.webp$#\1#p' | sort -u | paste -sd, -)
          echo "made=$made" >> "$GITHUB_OUTPUT"
          echo "New thumbnails: ${made:-none}"

  thumbnails-report:
    name: File an issue with the new thumbnails for the template agent
    needs: thumbnails
    if: always() && needs.thumbnails.outputs.made != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue, or add to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          MADE: ${{ needs.thumbnails.outputs.made }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'New thumbnails for %s, rendered from their real worlds on %s, are in the run'"'"'s template-thumbnails artifact:\n\n%s\n\nThe scheduled template agent looks at each and commits it to site/static/shots/templates, with its small copy for the dashboard in web/src/assets/template-thumbs. A NeoForge or Forge pack'"'"'s is drawn from its saved world without the mods'"'"' blocks, or made of the pack'"'"'s logo when its spawn is underground: commit a logo only when it'"'"'s the pack'"'"'s own branding, never a Minecraft-logo lookalike, and when a world doesn'"'"'t look like a real, good world shot, make the picture from the pack'"'"'s logo with site/tools/thumbnails/pack-art.mjs instead (site/README.md, Thumbnails).\n' "$MADE" "$(date -u +%F)" "$RUN")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Template thumbnails to add"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Template thumbnails to add" --body "$body"
          fi

  report:
    name: File an issue naming the templates that failed
    needs: [list, check]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: templates-*
          path: /tmp/results
      - name: Open the issue, or add to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(cat /tmp/results/*/results.json 2>/dev/null | jq -r '.templates[] | select(.status == "failing") | "- **\(.id)**: \(.failure)"' || true)
          [ -n "$failed" ] || failed="The run stopped before a template's result was written; its log is in the run."
          body=$(printf 'The template check on %s failed:\n\n%s\n\nRun: %s\n\nThe scheduled template agent fixes the pins or holds the template in a PR.\n' "$(date -u +%F)" "$failed" "$RUN")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Template check failing"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Template check failing" --body "$body"
          fi
