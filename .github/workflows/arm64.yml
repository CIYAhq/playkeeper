name: ARM64

# Playkeeper on 64-bit ARM servers (Oracle Cloud's Ampere A1, Hetzner's and
# AWS's ARM machines, a Raspberry Pi 4 or 5), on GitHub's ARM runners: the
# fast checks and the package built on ARM, every pinned Java runtime image run
# natively, and fresh ARM runners that install the arm64 tarball, walk the
# onboarding, play with protocol bots, back up, restore on a second runner
# installed with the one-line installer, start every server type with the
# hand-picked add-ons, the map, pre-generation and a modpack, and uninstall.
# It uses six ARM runners, so it runs on pull requests that change how
# Playkeeper is installed or updated or which runtime images it pins, when
# started by hand, and on the assets a release build made (artifact): in the
# Release check on the release it builds (release-check.yml), whose success a
# tag needs to publish those assets, and in the Release workflow's dry run on
# pull requests that change the release path (the packaging, the release
# scripts, the Makefile), which is why those aren't listed here.

on:
  pull_request:
    paths:
      - .github/workflows/arm64.yml
      - go.mod
      - go.sum
      - scripts/setup.sh
      - scripts/toolchains.txt
      - internal/install/**
      - internal/update/**
      - internal/docker/**
      - internal/minecraft/catalog.go
      - internal/minecraft/java.go
      - test/e2e/pkclient.py
      - test/e2e/scenario.py
      - test/e2e/software.py
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: The artifact with the release assets to test, in its assets/ folder; empty builds this commit on ARM.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}-${{ inputs.artifact || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"

defaults:
  run:
    shell: bash

jobs:
  # What make check and make lint-sh cover, run as CI runs them: the agent's
  # tests in shards side by side, which check that together they ran every
  # test.
  check:
    name: ARM — lint, typecheck and unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains (the arm64 Go and Node)
        run: ./scripts/setup.sh
      - name: make lint typecheck lint-sh
        run: make lint typecheck lint-sh
      - name: make test-go-other
        run: make test-go-other
      - name: make test-agent
        run: make test-agent OUT=/tmp/agent-tests
      - name: make test-web test-sh
        run: make test-web test-sh

  package:
    name: ARM — the release assets, built and checked on ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.assets.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains (the arm64 Go and Node)
        if: ${{ !inputs.artifact }}
        run: ./scripts/setup.sh
      - name: make package, signed with a throwaway key, and the release check (it runs the arm64 binary here)
        if: ${{ !inputs.artifact }}
        env:
          DRY_RUN: "true"
        run: |
          make package
          scripts/sign-release.sh dist "$RUNNER_TEMP/release-keys.pub"
          mkdir -p out/assets
          cp dist/get.sh dist/playkeeper-linux-{amd64,arm64}.tar.gz{,.sha256} dist/playkeeper-release.json{,.sig} out/assets/
          version=$(python3 -c "import json; print(json.load(open('out/assets/playkeeper-release.json'))['version'])")
          scripts/release-check.sh out/assets "$version" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-keys.pub"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.artifact }}
        with:
          name: arm64-release
          path: out/
          retention-days: 7
      - id: assets
        run: echo "artifact=${{ inputs.artifact || 'arm64-release' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: /tmp/release
      - name: The arm64 tarball, outside the checkout — checksum, contents, a static aarch64 binary that runs here
        run: |
          version=$(python3 -c "import json; print(json.load(open('/tmp/release/assets/playkeeper-release.json'))['version'])")
          mkdir -p /tmp/artifact
          cp /tmp/release/assets/playkeeper-linux-arm64.tar.gz /tmp/release/assets/playkeeper-linux-arm64.tar.gz.sha256 /tmp/artifact/
          cd /tmp/artifact
          sha256sum -c playkeeper-linux-arm64.tar.gz.sha256
          tar -tzvf playkeeper-linux-arm64.tar.gz
          if tar -tzf playkeeper-linux-arm64.tar.gz | grep -Ei '\.(jar|pem|key|env|db|sqlite)$|/\.git'; then echo "unexpected file in the tarball"; exit 1; fi
          tar -xzf playkeeper-linux-arm64.tar.gz
          file ./playkeeper-*-linux-arm64/playkeeper | tee /dev/stderr | grep -q 'ELF 64-bit LSB executable, ARM aarch64.*statically linked'
          reported=$(./playkeeper-*-linux-arm64/playkeeper version)
          echo "$reported"
          [[ $reported == "playkeeper $version ("* ]] || { echo "the arm64 binary reports '$reported', not version $version"; exit 1; }

  runtimes:
    name: ARM — every pinned Java runtime image, pulled and run natively
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned toolchains
        run: ./scripts/setup.sh
      - name: Java 8, 16, 17, 21 and 25 — the arm64 image from each digest, running as aarch64
        env:
          PLAYKEEPER_RUNTIME_IMAGES_TEST: "1"
        run: .tools/go/bin/go test -count=1 -run '^TestPinnedRuntimesRunJavaOnThisCPU$' -v ./internal/minecraft/

  install-and-play:
    name: Fresh ARM runner — install, onboarding, two bots, backup and restore, uninstall
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: /tmp/release
      - name: Test tools (Node for the protocol bots and the browser tests)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd test/e2e/bot && ../../../.tools/node/bin/npm ci --no-audit --no-fund)
          cd test/e2e/ui
          ../../../.tools/node/bin/npm ci --no-audit --no-fund
          sudo env "PATH=$PWD/../../../.tools/node/bin:$PATH" npx playwright install-deps chromium
          PATH="$PWD/../../../.tools/node/bin:$PATH" npx playwright install chromium
      - name: Install from the arm64 tarball (outside the checkout); preflight passes the CPU
        run: |
          mkdir -p /tmp/evidence
          cd /tmp/release/assets
          sha256sum -c playkeeper-linux-arm64.tar.gz.sha256
          tar -xzf playkeeper-linux-arm64.tar.gz
          cd playkeeper-*-linux-arm64
          sudo ./playkeeper preflight | tee /tmp/evidence/preflight.txt
          grep -Eq '^ *\[ok  \] CPU architecture +64-bit ARM \(arm64\)\.$' /tmp/evidence/preflight.txt
          start=$(date +%s)
          sudo ./install.sh --yes | tee /tmp/evidence/install.txt
          echo "install wall time: $(( $(date +%s) - start )) s" | tee -a /tmp/evidence/install.txt
          file /usr/local/bin/playkeeper | tee -a /tmp/evidence/install.txt | grep -q 'ARM aarch64'
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}' > /tmp/evidence/code
      - name: Enable the offline test harness (protocol bots have no Mojang accounts)
        run: |
          sudo mkdir -p /etc/systemd/system/playkeeper-agent.service.d
          printf '[Service]\nEnvironment=PLAYKEEPER_E2E_OFFLINE_MODE_UNSAFE=1\n' | sudo tee /etc/systemd/system/playkeeper-agent.service.d/e2e-offline.conf
          sudo systemctl daemon-reload
          sudo systemctl restart playkeeper-agent
      - name: Keyboard-only onboarding in the browser
        env:
          PK_URL: https://127.0.0.1:8443
          PK_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PK_SHOTS: /tmp/evidence/screenshots
          PK_OUT: /tmp/evidence/ui
        run: |
          export PK_SETUP_CODE="$(cat /tmp/evidence/code)"
          cd test/e2e/ui && npx playwright test onboarding.spec.ts --reporter=list
      - name: Protocol bots, sessions, console, backup, same-host restore and download
        env:
          PK_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 test/e2e/scenario.py host-a --existing --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem \
            --code "$(cat /tmp/evidence/code)" --game-host "$(cat /tmp/evidence/ui/join-address.txt)" --out /tmp/evidence/a
      - name: The server's container and Java run as aarch64, from the arm64 image
        run: |
          set -x
          container=$(sudo docker ps --filter label=io.playkeeper.managed=true --filter label=io.playkeeper.server --format '{{.Names}}')
          test "$(echo "$container" | wc -w)" = 1
          test "$(sudo docker exec "$container" uname -m)" = aarch64
          sudo docker exec "$container" java -version
          image=$(sudo docker inspect --format '{{.Image}}' "$container")
          test "$(sudo docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/arm64
      - name: Uninstall keeps the world and backups
        run: |
          worlds() { sudo sh -c 'find /var/lib/playkeeper/servers/*/data/world /var/lib/playkeeper/backups -type f -exec sha256sum {} +' | sort -k2; }
          worlds > /tmp/evidence/data-before.txt
          test -s /tmp/evidence/data-before.txt
          sudo playkeeper uninstall --yes | tee /tmp/evidence/uninstall.txt
          worlds > /tmp/evidence/data-after.txt
          diff /tmp/evidence/data-before.txt /tmp/evidence/data-after.txt
          if systemctl list-unit-files | grep playkeeper; then echo "units left behind"; exit 1; fi
          if sudo ss -ltnH | grep -E ':(8443|25565) '; then echo "listeners left behind"; exit 1; fi
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/ui/browser-session.json /tmp/evidence/a/state-a.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: arm64-evidence-host-a
          path: /tmp/evidence
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-world-backup
          path: |
            /tmp/evidence/a/world-backup.tar.gz
            /tmp/evidence/a/marker.json
            /tmp/evidence/a/host-a-results.json
          retention-days: 7

  restore-second-host:
    name: Second fresh ARM runner — one-line install picks arm64, restore the backup, verify the marker
    needs: [package, install-and-play]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: /tmp/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arm64-world-backup
          path: /tmp/backup
      - name: Test tools (Node for the protocol bot)
        run: |
          ./scripts/setup.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
          (cd test/e2e/bot && ../../../.tools/node/bin/npm ci --no-audit --no-fund)
      - name: One-line install (get.sh) from a local mirror of both tarballs; a wrong checksum is refused
        run: |
          set -o pipefail
          mkdir -p /tmp/evidence /tmp/mirror/bad
          cp /tmp/release/assets/get.sh /tmp/release/assets/playkeeper-linux-{amd64,arm64}.tar.gz{,.sha256} /tmp/mirror/
          cp /tmp/release/assets/playkeeper-linux-arm64.tar.gz /tmp/mirror/bad/
          printf '%064d  playkeeper-linux-arm64.tar.gz\n' 0 > /tmp/mirror/bad/playkeeper-linux-arm64.tar.gz.sha256
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/mirror > /tmp/evidence/mirror-log.txt 2>&1 &
          sleep 1
          if curl -fsSL http://127.0.0.1:8765/get.sh | sudo PLAYKEEPER_BASE_URL=http://127.0.0.1:8765/bad PLAYKEEPER_ALLOW_HTTP=1 sh -s -- --yes 2>&1 | tee /tmp/evidence/oneliner-bad-checksum.txt; then
            echo "a tarball with a wrong checksum was installed"; exit 1
          fi
          grep -q 'does not match its published checksum' /tmp/evidence/oneliner-bad-checksum.txt
          test ! -e /usr/local/bin/playkeeper
          curl -fsSL http://127.0.0.1:8765/get.sh | sudo PLAYKEEPER_BASE_URL=http://127.0.0.1:8765 PLAYKEEPER_ALLOW_HTTP=1 sh -s -- --yes | tee /tmp/evidence/install.txt
          grep -q '^Downloading playkeeper-linux-arm64.tar.gz from http://127.0.0.1:8765$' /tmp/evidence/install.txt
          if grep 'GET /playkeeper-linux-amd64' /tmp/evidence/mirror-log.txt; then echo "the one-line installer fetched the amd64 tarball on ARM"; exit 1; fi
          file /usr/local/bin/playkeeper | tee -a /tmp/evidence/install.txt | grep -q 'ARM aarch64'
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}' > /tmp/evidence/code
          sudo mkdir -p /etc/systemd/system/playkeeper-agent.service.d
          printf '[Service]\nEnvironment=PLAYKEEPER_E2E_OFFLINE_MODE_UNSAFE=1\n' | sudo tee /etc/systemd/system/playkeeper-agent.service.d/e2e-offline.conf
          sudo systemctl daemon-reload && sudo systemctl restart playkeeper-agent
      - name: Guarded restore and marker verification (console and client view)
        env:
          PK_ADMIN_PASSWORD: ci-b-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sha=$(python3 -c "import json; print(json.load(open('/tmp/backup/host-a-results.json'))['backup']['sha256'])")
          python3 test/e2e/scenario.py host-b --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --code "$(cat /tmp/evidence/code)" \
            --game-host 127.0.0.1 --archive /tmp/backup/world-backup.tar.gz --marker /tmp/backup/marker.json --expect-sha256 "$sha" --out /tmp/evidence/b
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/b/state-b.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: arm64-evidence-host-b
          path: /tmp/evidence
          retention-days: 7

  software:
    name: Fresh ARM runner — every server type, the add-ons, the map, pre-generation and a modpack
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: /tmp/release
      - name: Install from the arm64 tarball (outside the checkout)
        run: |
          mkdir -p /tmp/evidence
          cd /tmp/release/assets
          sha256sum -c playkeeper-linux-arm64.tar.gz.sha256
          tar -xzf playkeeper-linux-arm64.tar.gz
          sudo ./playkeeper-*-linux-arm64/install.sh --yes | tee /tmp/evidence/install.txt
          sudo cat /var/lib/playkeeper/panel/tls/cert.pem > /tmp/evidence/cert.pem
          grep -o 'setup code: [a-z0-9-]*' /tmp/evidence/install.txt | awk '{print $3}' > /tmp/evidence/code
      - name: Paper, Purpur, Vanilla, Fabric, Quilt, NeoForge and Forge; add-ons, map, voice chat and pre-generation on Paper and Fabric; a Modrinth modpack
        env:
          PK_ADMIN_PASSWORD: ci-s-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 test/e2e/software.py --url https://127.0.0.1:8443 --cacert /tmp/evidence/cert.pem --code "$(cat /tmp/evidence/code)" --out /tmp/evidence/software
      - name: Uninstall leaves no services or listeners
        run: |
          sudo playkeeper uninstall --yes | tee /tmp/evidence/uninstall.txt
          if systemctl list-unit-files | grep playkeeper; then echo "units left behind"; exit 1; fi
          if sudo ss -ltnH | grep -E ':(8443|25565) '; then echo "listeners left behind"; exit 1; fi
      - name: Collect evidence
        if: always()
        run: |
          sudo journalctl -u playkeeper-agent -u playkeeper-panel --no-pager > /tmp/evidence/journal.txt || true
          rm -f /tmp/evidence/code /tmp/evidence/software/state-software.json
          sudo chown -R "$(id -u)" /tmp/evidence
          sed -i -E 's/(setup code: |#code=)[a-z0-9-]+/\1<redacted>/g' /tmp/evidence/install.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: arm64-evidence-software
          path: /tmp/evidence
          retention-days: 7
